schema_version: 1

context:
  name: lbapcommon
  version: "0.21.0"
  python_min: '3.12'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 28c923949db3914385359d21a72a0d598fee88c498f8c4a384d770d51f8aed9c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools-scm
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - strictyaml
    - jinja2
    - lxml
    - pyyaml
    - setuptools
    - boost-histogram
    - hist
    - pandas
    - numpy
    - requests
    - uproot >=5.0.0
    - awkward >=2.1.1
    - matplotlib-base
    - networkx
    - lbdiracwrappers
    - pydantic >=2
    - quickjs
    - cwl-utils
    - cwltool
    # Temporary: conda-forge's schema-salad 8.10.20260825112551 pins mistune <3.3 but its
    # wheel metadata requires >=3.3, so `pip check` fails. Drop once the feedstock is fixed.
    - schema-salad !=8.10.20260825112551

tests:
  - python:
      imports:
        - LbAPCommon
        - LbAPCommon.linting
        - LbAPCommon.validators
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
  - script:
      - python test_transform.py
    files:
      recipe:
        - test_transform.py

about:
  summary: Common utilities used by LHCb DPA WP2 related software
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://gitlab.cern.ch/lhcb-dpa/analysis-productions/LbAPCommon
  repository: https://gitlab.cern.ch/lhcb-dpa/analysis-productions/LbAPCommon

extra:
  recipe-maintainers:
    - ryuwd
    - chrisburr
